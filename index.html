<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laura Guimarães</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1108;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ── FOTO HERO ── */
  .hero {
    width: 100%;
    max-width: 480px;
    position: relative;
  }
  .hero img {
    width: 100%;
    display: block;
    object-fit: cover;
    object-position: top center;
    max-height: 72vh;
  }
  .hero-fade {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 160px;
    background: linear-gradient(to top, #1a1108, transparent);
  }

  /* ── CONTEÚDO ── */
  .content {
    width: 100%;
    max-width: 480px;
    padding: 0 28px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: -24px;
    position: relative;
    z-index: 2;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    font-weight: 600;
    color: #f5ede0;
    letter-spacing: 0.04em;
    text-align: center;
    margin-bottom: 8px;
  }

  .tagline {
    font-size: 0.78rem;
    color: rgba(245,237,224,0.45);
    letter-spacing: 0.14em;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  /* ícone WhatsApp */
  .wpp-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(201,168,76,0.4);
    color: #c9a84c;
    font-size: 1.1rem;
    text-decoration: none;
    margin-bottom: 28px;
    transition: background 0.2s, border-color 0.2s;
  }
  .wpp-icon:hover { background: rgba(201,168,76,0.1); border-color: rgba(201,168,76,0.7); }

  /* ── BOTÕES ── */
  .buttons {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
  }

  .btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 17px 24px;
    border: 1px solid rgba(201,168,76,0.5);
    background: transparent;
    color: #f5ede0;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 0.25s, border-color 0.25s, color 0.25s;
    position: relative;
    overflow: hidden;
  }
  .btn:hover {
    background: rgba(201,168,76,0.1);
    border-color: rgba(201,168,76,0.9);
    color: #c9a84c;
  }
  .btn:active { transform: scale(0.98); }

  /* botão destaque */
  .btn-destaque {
    background: rgba(201,168,76,0.08);
    border-color: rgba(201,168,76,0.7);
  }
  .btn-destaque::before {
    content: '🔥';
    position: absolute;
    left: 16px;
    font-size: 0.85rem;
  }

  /* ── URGÊNCIA ── */
  .urgencia {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-left: 2px solid #c0392b;
    background: rgba(192,57,43,0.07);
    margin-bottom: 28px;
  }
  .urgencia-dot {
    width: 7px; height: 7px;
    background: #e74c3c;
    border-radius: 50%;
    flex-shrink: 0;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.15} }
  .urgencia p {
    font-size: 0.78rem;
    color: rgba(245,237,224,0.7);
    line-height: 1.4;
  }
  .urgencia strong { color: #f5ede0; }

  /* ── DIVISOR ── */
  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(201,168,76,0.2);
  }
  .divider span {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(201,168,76,0.4);
  }

  /* ── FOOTER ── */
  .footer {
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(245,237,224,0.15);
    text-align: center;
  }
  .footer span { color: rgba(201,168,76,0.35); }

  /* animação */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hero { animation: fadeUp 0.7s 0.05s both; }
  .content > * { animation: fadeUp 0.6s both; }
  .content > *:nth-child(1) { animation-delay: 0.2s; }
  .content > *:nth-child(2) { animation-delay: 0.27s; }
  .content > *:nth-child(3) { animation-delay: 0.34s; }
  .content > *:nth-child(4) { animation-delay: 0.4s; }
  .content > *:nth-child(5) { animation-delay: 0.46s; }
  .content > *:nth-child(6) { animation-delay: 0.52s; }
  .content > *:nth-child(7) { animation-delay: 0.58s; }
</style>
</head>
